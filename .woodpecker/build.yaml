when:
  - event: [push, manual]

steps:
  install:
    image: node:22-alpine
    commands:
      - npm ci

  build:
    image: node:22-alpine
    commands:
      - npm run build
      - ls -la dist/frontend1/browser

  docker-build:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t frontend1:${CI_COMMIT_SHA} .

  deploy:
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/frontend1:/deploy:ro
    commands:
      - IMAGE_TAG=${CI_COMMIT_SHA} docker compose -f /deploy/compose.yaml up -d
      - docker ps --filter name=frontend1

  test-restricted-deploy:
    image: alpine:3.22
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - chmod 700 ~/.ssh
      - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H 172.19.0.1 >> ~/.ssh/known_hosts
      - ssh -i ~/.ssh/id_ed25519 ci-deploy@172.19.0.1 "deploy-app frontend1 ${CI_COMMIT_SHA}"
